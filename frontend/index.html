<!doctype html>
<!-- Nur für den Vite-Server; im Betrieb liefert QUIQQER standalone.html aus. -->
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#14161A" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#F6F6F3" media="(prefers-color-scheme: light)">
    <title>PWA Starter</title>
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
    <script>try{var t=localStorage.getItem('pwastarter.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
    <script type="module" src="/app.js"></script>
</head>
<body>
<div id="app"></div>
</body>
</html>
