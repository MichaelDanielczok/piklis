<!doctype html>
<!-- Inhalt des Feldes „Standalone Content“ der Startseite (Seitentyp
     quiqqer/sitetypes:types/standalone, Ausgabetyp text/html). Bleibt nach
     einem Build unverändert, weil app.js und app.css feste Namen haben.
     frontend/index.html spiegelt diese Datei für den Vite-Server. -->
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141615" media="(prefers-color-scheme: dark)">
    <title>Piklis</title>
    <!-- PWA: Manifest und Service Worker liefert das Paket unter der Wurzel aus (Pwa\EventHandler) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/packages/michaeldanielczok/piklis/bin/app/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/packages/michaeldanielczok/piklis/bin/app/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/packages/michaeldanielczok/piklis/bin/app/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Piklis">
    <!-- Inhalt reicht unter die Statusleiste (safe-area-inset-top in AppPage) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Motiv vor dem ersten Zeichnen (wie applyStoredTheme in useSession.js) -->
    <script>try{var t=localStorage.getItem('pk.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
    <!-- Loader bis zum Start der App (App-Icon und Balken); Vue ersetzt den Inhalt
         von #app beim Mount. Farben wie --color-bg/--color-accent in tokens.css -->
    <style>
        html, body { margin: 0; min-height: 100%; background: #F7F6F3; }
        @media (prefers-color-scheme: dark) {
            html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #141615; }
            html:not([data-theme="light"]) .boot__bar { background: rgb(92 196 149 / 0.2); }
            html:not([data-theme="light"]) .boot__bar::after { background: #5CC495; }
        }
        html[data-theme="dark"], html[data-theme="dark"] body { background: #141615; }
        html[data-theme="dark"] .boot__bar { background: rgb(92 196 149 / 0.2); }
        html[data-theme="dark"] .boot__bar::after { background: #5CC495; }
        .boot { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 24px; align-items: center; justify-content: center; opacity: 0; animation: boot-in 0.3s ease-out 0.2s forwards; }
        .boot__logo { width: 64px; height: 64px; }
        .boot__bar { position: relative; width: 72px; height: 3px; overflow: hidden; border-radius: 3px; background: rgb(31 110 78 / 0.18); }
        .boot__bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: inherit; background: #1F6E4E; animation: boot-bar 1.2s ease-in-out infinite; }
        @keyframes boot-in { to { opacity: 1; } }
        @keyframes boot-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
        @media (prefers-reduced-motion: reduce) {
            .boot__bar::after { animation: none; }
        }
    </style>
    <link rel="stylesheet" href="/packages/michaeldanielczok/piklis/bin/app/app.css">
    <script type="module" src="/packages/michaeldanielczok/piklis/bin/app/app.js"></script>
</head>
<body>
<div id="app">
    <div class="boot" role="status" aria-label="Wird geladen …">
        <svg class="boot__logo" viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="22" fill="#1F6E4E"/><rect x="34" y="16" width="44" height="56" rx="9" fill="#8FCBAF" transform="rotate(9 56 44)"/><g transform="rotate(-6 44 52)"><rect x="20" y="24" width="46" height="56" rx="9" fill="#FFFFFF"/><rect x="27" y="35" width="16" height="16" rx="4.5" fill="#1F6E4E"/><path d="M31 43l2.8 2.8 5.6-6" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M49 43h10M27 64h32" stroke="#1F6E4E" stroke-width="7" stroke-linecap="round"/></g></svg>
        <div class="boot__bar"></div>
    </div>
</div>
</body>
</html>
